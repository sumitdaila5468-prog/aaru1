<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I am so sorry... 🥺</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating Hearts Background */
    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      animation: float 6s linear infinite;
      font-size: 20px;
      user-select: none;
      z-index: 1;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Card Container */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
      text-align: center;
      max-width: 380px;
      width: 90%;
      z-index: 10;
      transform: scale(0.9);
      animation: popIn 0.6s ease-out forwards;
    }

    @keyframes popIn {
      to {
        transform: scale(1);
      }
    }

    .gif-container img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      color: #d63384;
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-yes {
      background-color: #ff4b2b;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 75, 43, 0.3);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      background-color: #ff416c;
    }

    /* Success Screen Hide/Show */
    .success-message {
      display: none;
    }

    .success-message h2 {
      color: #ff416c;
      font-size: 24px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="gif-container">
      <!-- Cute Sad Bear GIF -->
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHYxc20xbmdwbjFwZXh3b3k1MHBocXAzcXhyeDR4ODRrcGFxeDY1eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l378giAZvhPDVXg0U/giphy.gif" alt="Sad Bear">
    </div>
    <h1>I'm So Sorry... 🥺</h1>
    <p>Mera irada tumhe hurt karne ka bilkul nahi tha. Please gussa chhodo na? Main aage se dhyan rakhunga. Maaf kar do na please? ❤️</p>
    
    <div class="btn-group">
      <button class="btn-yes" onclick="forgiveMe()">Maaf Kiya 💖</button>
    </div>
  </div>

  <div class="card success-message" id="successCard">
    <div class="gif-container">
      <!-- Cute Happy Hug GIF -->
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzlsM3pza3QxNnIwdXg1bjZocWF2bGF1NHlyczBmcHlycjJ4OWszNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/G3va31oEEnIkM/giphy.gif" alt="Happy Hug">
    </div>
    <h2>Yayyy! Thank You! 🥰</h2>
    <p>You are the best! I love you so much ❤️✨</p>
  </div>

  <script>
    // Background Floating Hearts Generator
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }
    setInterval(createHeart, 400);

    // On Click Action
    function forgiveMe() {
      document.getElementById('mainCard').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';
    }
  </script>
</body>
</html>
